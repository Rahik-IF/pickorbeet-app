name: pickorbeet
description: "PickOrbeet shop for Android and iOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State, results, and networking
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  fpdart: ^1.2.0
  http: ^1.6.0
  cookie_jar: ^4.0.9
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.4
  decimal: ^3.2.6
  intl: ^0.20.3

  # Navigation and platform
  go_router: ^17.2.3
  webview_flutter: ^4.13.1
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.2
  geolocator: ^13.0.4
  web_socket_channel: ^3.0.3
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.2

  # UI and motion
  cupertino_icons: ^1.0.8
  phosphor_flutter: ^2.1.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  animations: ^2.2.0
  skeletonizer: ^3.0.0
  smooth_page_indicator: ^3.0.0
  confetti: ^0.8.0
  flutter_svg: ^2.3.0
  speech_to_text: ^7.4.0
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.1
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/couriers/
    - assets/notifications/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/NotoSansBengali-OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
    # Only the taka sign (U+09F3), at every weight the UI uses.
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansBengali-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/launcher/icon.png
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: assets/launcher/icon_background.png
  adaptive_icon_foreground: assets/launcher/icon_foreground.png
  adaptive_icon_monochrome: assets/launcher/icon_monochrome.png

flutter_native_splash:
  color: "#012783"
  image: assets/launcher/splash.png
  android_12:
    color: "#012783"
    image: assets/launcher/splash_android12.png
  ios_content_mode: center
  fullscreen: false
